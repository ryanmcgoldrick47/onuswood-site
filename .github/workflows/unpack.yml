name: Unpack site.zip
on:
  push:
    paths: ["site.zip"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into the repo and remove the zip
        run: |
          unzip -o site.zip -d .
          git rm -q --cached site.zip
          rm -f site.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack site.zip" || echo "Nothing to commit"
          git push
